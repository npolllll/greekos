# Fly.io app for the GreekOS voice gateway (WebSocket). The deploy script sets `app` and the secrets.
#   flyctl deploy --config voice-gateway/fly.toml --dockerfile voice-gateway/Dockerfile   (from the app folder)
app = "greekos-voice"
primary_region = "fra"   # Frankfurt: next to Supabase EU and Azure West Europe

[http_service]
  internal_port = 8080
  force_https = true
  # A conversation must not wait for a cold start: one machine always runs.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
