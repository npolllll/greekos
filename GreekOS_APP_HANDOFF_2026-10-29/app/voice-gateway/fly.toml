# Fly.io app for the GreekOS voice gateway (WebSocket). The deploy script sets `app` and the secrets.
#   flyctl deploy --config voice-gateway/fly.toml --dockerfile voice-gateway/Dockerfile   (from the app folder)
app = "greekos-voice"
primary_region = "fra"   # Frankfurt: next to Supabase EU and Azure West Europe

[http_service]
  internal_port = 8080
  force_https = true
  # Budget (≤ 10 €/month for everything): the machine sleeps when no conversation is open and starts on
  # the next connection (a few seconds once; Fly bills running seconds and the stopped root disk).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"   # a WebSocket conversation is one connection; idle = no open conversations
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
