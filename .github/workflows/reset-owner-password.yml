
name: Reset GreekOS owner password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Update existing owner password
        env:
          SUPABASE_URL: https://pvlcjzwidvadoumpyxbu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          NEW_PASSWORD: ${{ secrets.GREEKOS_OWNER_NEW_PASSWORD }}
        run: |
          node <<'NODE'
          const { SUPABASE_URL: url, SUPABASE_SERVICE_ROLE_KEY: key,
                  OWNER_EMAIL: email, NEW_PASSWORD: password } = process.env;

          if (!key || !email || !password || password.length < 12) {
            throw new Error("Required secrets missing or password too short");
          }

          const headers = {
            apikey: key,
            Authorization: `Bearer ${key}`,
            "Content-Type": "application/json"
          };

          async function main() {
            const res = await fetch(`${url}/auth/v1/admin/users?page=1&per_page=1000`, { headers });
            if (!res.ok) throw new Error("Cannot retrieve users");

            const data = await res.json();
            const matches = data.users.filter(u =>
              u.email?.toLowerCase() === email.toLowerCase()
            );

            if (matches.length !== 1) throw new Error("Owner not uniquely found");

            const result = await fetch(
              `${url}/auth/v1/admin/users/${matches[0].id}`,
              {
                method: "PUT",
                headers,
                body: JSON.stringify({ password })
              }
            );

            if (!result.ok) throw new Error("Password update failed");
            console.log("SUCCESS: Owner password updated");
          }

          main().catch(err => {
            console.error(err.message);
            process.exitCode = 1;
          });
          NODE
