
name: Check Supabase database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Test database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || {
            echo "::error::DATABASE_URL is missing"
            exit 1
          }

          result=$(psql "$DATABASE_URL" \
            -X -qAt -v ON_ERROR_STOP=1 \
            -c "SELECT 1")

          if [ "$result" = "1" ]; then
            echo "SUCCESS: Supabase connection works"
          else
            echo "::error::Unexpected database response"
            exit 1
          fi
