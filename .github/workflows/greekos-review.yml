# GreekOS — editorial review data: exports the current course corpus from production and runs the objective
# audio checks (course files and candidate voices). Results are committed to the requesting branch under
# GreekOS_APP_HANDOFF_2026-10-29/app/reports/review/ — course content and measurements only, no learner data.
# Request: commit "corpus", "assets" and/or "voices" (comma-separated, first line) to
# GreekOS_APP_HANDOFF_2026-10-29/app/ops/review-request on a claude/** branch.
name: GreekOS review

on:
  push:
    branches: ['claude/**']
    paths: ['GreekOS_APP_HANDOFF_2026-10-29/app/ops/review-request']

permissions:
  contents: write

concurrency:
  group: greekos-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: GreekOS_APP_HANDOFF_2026-10-29/app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'northeurope' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tasks
        id: task
        run: |
          t=$(head -n1 ops/review-request | tr -d '[:space:]')
          echo "tasks=,$t," >> "$GITHUB_OUTPUT"; echo "Tasks: $t"
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tools (audio analysis, independent recogniser)
        if: contains(steps.task.outputs.tasks, ',assets,') || contains(steps.task.outputs.tasks, ',voices,')
        run: pip install -q numpy praat-parselmouth faster-whisper
      - name: corpus (current content after all revisions)
        if: contains(steps.task.outputs.tasks, ',corpus,')
        run: bash scripts/review/export-corpus.sh
      - name: assets (142 course audio files)
        if: contains(steps.task.outputs.tasks, ',assets,')
        run: python3 scripts/review/audio_review.py assets
      - name: voices (candidate Azure voices on a Greek test set)
        if: contains(steps.task.outputs.tasks, ',voices,')
        run: python3 scripts/review/audio_review.py voices
      - name: Commit the results to the requesting branch
        if: always()
        working-directory: .
        run: |
          git config user.name "greekos-review"
          git config user.email "greekos-review@users.noreply.github.com"
          git add GreekOS_APP_HANDOFF_2026-10-29/app/reports/review || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -qm "Review data: ${{ steps.task.outputs.tasks }} ($(date -u +%FT%TZ))"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
