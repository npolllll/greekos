# GreekOS — weekly encrypted database backup (the Supabase free plan has no automatic backups).
# The dump (learners, progress, releases, content; audio file list with SHA-256) is encrypted with
# BACKUP_PASSPHRASE before it leaves the runner and is kept as a private workflow artifact for 90 days.
# Restore: download the artifact, `gpg -d file.gpg > file.dump`, then see docs/OPERATIONS.md.
name: GreekOS backup

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GreekOS_APP_HANDOFF_2026-10-29/app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present
        run: |
          [ -n "$DATABASE_URL" ] && [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Set DATABASE_URL and BACKUP_PASSPHRASE secrets"; exit 1; }
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        run: |
          bash scripts/backup-db.sh backups
          for f in backups/*; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            shred -u "$f"
          done
          ls -la backups
      - uses: actions/upload-artifact@v4
        with:
          name: greekos-backup-${{ github.run_id }}
          path: GreekOS_APP_HANDOFF_2026-10-29/app/backups/*.gpg
          retention-days: 90
