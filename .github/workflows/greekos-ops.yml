# GreekOS — operations tasks that need the production secrets but change nothing for learners:
# provider diagnostics, a read-only state report, the backup restore test, production acceptance.
# Run: Actions → «GreekOS ops» → Run workflow → task. A maintenance branch can also request a task by
# committing its name to GreekOS_APP_HANDOFF_2026-10-29/app/ops/request (first line).
# Every task prints counts and statuses only: no keys, no e-mails, no learner content.
name: GreekOS ops

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'one or more, comma-separated: db-state, llm-diagnose, restore-test, acceptance'
        default: 'db-state'
        required: true
  push:
    branches: ['claude/**']
    paths: ['GreekOS_APP_HANDOFF_2026-10-29/app/ops/request']

permissions:
  contents: read

concurrency:
  group: greekos-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: GreekOS_APP_HANDOFF_2026-10-29/app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      APP_URL: ${{ secrets.APP_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'westeurope' }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      ACCEPT_SPEAKING: ${{ vars.ACCEPT_SPEAKING || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Task
        id: task
        env:
          INPUT_TASK: ${{ inputs.task }}
        run: |
          t="${INPUT_TASK:-}"
          [ -n "$t" ] || t=$(head -n1 ops/request | tr -d '[:space:]')
          for x in ${t//,/ }; do
            case "$x" in db-state|llm-diagnose|restore-test|acceptance) ;; *) echo "::error::unknown task '$x'"; exit 1;; esac
          done
          echo "tasks=,$t," >> "$GITHUB_OUTPUT"
          echo "name=${t//,/-}" >> "$GITHUB_OUTPUT"
          echo "Tasks: $t"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GreekOS_APP_HANDOFF_2026-10-29/app/package-lock.json
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - name: db-state
        if: contains(steps.task.outputs.tasks, ',db-state,')
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/ops/db-state.sql
      - name: llm-diagnose
        if: contains(steps.task.outputs.tasks, ',llm-diagnose,')
        run: node scripts/ops/llm-diagnose.mjs
        env:
          LLM_DIAG_CASES: ${{ vars.LLM_DIAG_CASES || 'A,C,D,E' }}
      - name: restore-test
        if: contains(steps.task.outputs.tasks, ',restore-test,')
        run: bash scripts/ops/restore-test.sh
      - name: acceptance
        if: contains(steps.task.outputs.tasks, ',acceptance,')
        run: |
          npx playwright install --with-deps chromium
          npx tsx scripts/ops/acceptance.ts
      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greekos-ops-${{ steps.task.outputs.name }}-${{ github.run_id }}
          path: GreekOS_APP_HANDOFF_2026-10-29/app/reports/ops
          if-no-files-found: ignore
          retention-days: 30
